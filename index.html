<!DOCTYPE html>
<html>
<head>
    <title>Asteroid Radar</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>

    <h1 class="neon-title">ASTEROID RADAR</h1>

    <!-- Main controls & view -->
    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        
        <!-- Left: 3D Screen -->
        <div id="space-box"></div>

        <!-- Right: Neon Table -->
        <div style="min-width: 280px;">
            <h3 class="neon-text">Today's Approaching Asteroids</h3>
            <div class="table-container">
                <table id="asteroid-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Size (m)</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="2">Scanning telemetry...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Info Box -->
    <fieldset id="info-fieldset">
        <legend class="neon-text">Selected Asteroid Telemetry</legend>
        <p id="info-text">Click an asteroid from the table above to view live stats.</p>
    </fieldset>

    <script type="module" src="src/main.js"></script>
</body>
</html>
